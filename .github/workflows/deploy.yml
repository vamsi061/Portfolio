name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mistral API key from secret
        run: |
          if [ -z "${{ secrets.MISTRAL_API_KEY }}" ]; then
            echo "WARNING: MISTRAL_API_KEY secret not set — chatbot key placeholder kept."
            exit 0
          fi
          sed -i "s|__MISTRAL_API_KEY__|${{ secrets.MISTRAL_API_KEY }}|" js/chatbot-data.js
          echo "Key injected into js/chatbot-data.js"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,.github/**'
